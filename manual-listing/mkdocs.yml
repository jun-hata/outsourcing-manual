site_name: 出品外注さん専用マニュアル
site_url: https://hatakeyama-manual.uk/manual-listing/

theme:
  name: material
  language: ja
  features:
    - navigation.sections
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - toc.follow
    - content.code.copy

extra_css:
  - stylesheets/extra.css?v=20261020a

markdown_extensions:
  - md_in_html
  - attr_list
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - TOP: index.md

  - はじめに:
      - 報酬について: compensation.md
      - 禁止事項: prohibited.md

  - 事前準備:
      - 作業開始準備: required_info.md
      - ブラウザについて: browser_setup.md
      - ebayのアカウント作成: env_ebay_login.md

  - 専用ツールの準備:
      - 各種拡張機能導入: env_extensions.md
      - 在庫管理ツール【e-ship】とは: env_eship_login.md

  - 出品作業フロー:
      - 出品手順（STEP①〜⑦）: workflow.md

  - 詳細ガイド:
      - 最安値リサーチの判断基準（仮）: guide_ebay_research.md
      - Geminiタイトル作成テクニック（仮）: guide_gemini_title.md
      - Shipping Policyの選び方（仮）: guide_shipping_policy.md
      - Item Specifics入力ルール（仮）: guide_item_specifics.md
      - フィードバック対応（仮）: guide_feedback.md

  - トラブル対応:
      - よくある質問・FAQ: 99_faq.md
