site_name: 出品外注さん専用マニュアル
site_url: https://hatakeyama-manual.uk/manual-listing/

theme:
  name: material
  language: ja
  features:
    - navigation.sections
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - toc.follow
    - content.code.copy

extra_css:
  - stylesheets/extra.css?v=20261020a

markdown_extensions:
  - md_in_html
  - attr_list
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - TOP: index.md

  - はじめに:
      - 報酬について: compensation.md
      - 禁止事項: prohibited.md

  - 事前準備:
      - 作業開始準備: required_info.md
      - ブラウザについて: browser_setup.md
      - ebayのアカウント作成: env_ebay_login.md

  - 専用ツールの準備:
      - 各種拡張機能導入: env_extensions.md
      - 在庫管理ツール【e-ship】とは: env_eship_login.md
      - リサーチサポートツールとは: tool_support_setup.md

  - 出品作業フロー:
      - 出品手順（STEP①〜⑦）: workflow.md
      - 出品実践動画: listing_video.md

  - 詳細ガイド:
      - 最安値を確認しよう: guide_check_lowest_price.md
      - 販売価格のルール: guide_price_rules.md
      - タイトル付けの必要知識: guide_title_knowledge.md
      - 商品画像について: guide_item_images.md
      - 出品ページの全体像と解説: guide_listing_page_overview.md

  - トラブル対応:
      - よくある質問・FAQ: 99_faq.md
