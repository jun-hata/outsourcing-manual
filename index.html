<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リサーチ外注さん専用ポータル | Hatakeyama Manual</title>
  <meta name="description" content="リサーチ外注スタッフ専用の業務マニュアルポータルサイトです。ご採用時期に応じたマニュアルへ移動できます。">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --card-bg-v1: rgba(30, 41, 59, 0.7);
      --card-bg-v2: rgba(49, 46, 129, 0.6);
      --card-border-v1: rgba(148, 163, 184, 0.2);
      --card-border-v2: rgba(99, 102, 241, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-v1: #38bdf8;
      --accent-v2: #6366f1;
      --accent-v2-glow: rgba(99, 102, 241, 0.35);
      --badge-v1: rgba(56, 189, 248, 0.15);
      --badge-v2: rgba(99, 102, 241, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1.5rem;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Background Glows */
    body::before {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, rgba(0,0,0,0) 70%);
      top: -100px;
      left: -100px;
      z-index: 0;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(0,0,0,0) 70%);
      bottom: -100px;
      right: -100px;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      max-width: 960px;
      width: 100%;
      z-index: 1;
      text-align: center;
    }

    header {
      margin-bottom: 3.5rem;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--accent-v1);
      margin-bottom: 1.25rem;
      backdrop-filter: blur(8px);
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
      margin-bottom: 3.5rem;
    }

    .card {
      position: relative;
      border-radius: 1.25rem;
      padding: 2.25rem 2rem;
      text-align: left;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    .card-v1 {
      background: var(--card-bg-v1);
      border: 1px solid var(--card-border-v1);
    }

    .card-v1:hover {
      transform: translateY(-6px);
      border-color: var(--accent-v1);
      box-shadow: 0 20px 30px -10px rgba(56, 189, 248, 0.2);
    }

    .card-v2 {
      background: var(--card-bg-v2);
      border: 1px solid var(--card-border-v2);
      box-shadow: 0 10px 25px -5px var(--accent-v2-glow);
    }

    .card-v2:hover {
      transform: translateY(-6px);
      border-color: #818cf8;
      box-shadow: 0 25px 35px -10px rgba(99, 102, 241, 0.4);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .icon-box {
      width: 3rem;
      height: 3rem;
      border-radius: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .icon-v1 {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-v1);
    }

    .icon-v2 {
      background: rgba(99, 102, 241, 0.25);
      color: #818cf8;
    }

    .tag {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.3rem 0.75rem;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .tag-v1 {
      background: var(--badge-v1);
      color: var(--accent-v1);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .tag-v2 {
      background: var(--badge-v2);
      color: #a5b4fc;
      border: 1px solid rgba(165, 180, 252, 0.4);
    }

    .card-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }

    .card-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 2rem;
      flex-grow: 1;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.875rem 1.25rem;
      border-radius: 0.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn-v1 {
      background: rgba(255, 255, 255, 0.08);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .card-v1:hover .btn-v1 {
      background: var(--accent-v1);
      color: #0f172a;
      border-color: var(--accent-v1);
    }

    .btn-v2 {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .card-v2:hover .btn-v2 {
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    footer {
      font-size: 0.875rem;
      color: #64748b;
    }

    @media (max-width: 640px) {
      h1 {
        font-size: 1.75rem;
      }
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo-badge">
        <span>📖</span> Hatakeyama Research Portal
      </div>
      <h1>リサーチ外注さん専用ポータル</h1>
      <p class="subtitle">採用時期に応じたマニュアルを選択してご確認ください。</p>
    </header>

    <div class="grid">
      <!-- v1 Card -->
      <a href="./manual-v1/" class="card card-v1" id="link-manual-v1">
        <div>
          <div class="card-header">
            <div class="icon-box icon-v1">📚</div>
            <span class="tag tag-v1">旧版マニュアル</span>
          </div>
          <h2 class="card-title">2026年8月以前<br>採用者向け</h2>
          <p class="card-desc">
            2026年8月より前にご採用・稼働を開始された外注スタッフ専用のマニュアルです。
          </p>
        </div>
        <div class="btn btn-v1">
          <span>旧版マニュアルを開く</span>
          <span>→</span>
        </div>
      </a>

      <!-- v2 Card -->
      <a href="./manual-v2/" class="card card-v2" id="link-manual-v2">
        <div>
          <div class="card-header">
            <div class="icon-box icon-v2">🚀</div>
            <span class="tag tag-v2">新版マニュアル</span>
          </div>
          <h2 class="card-title">2026年8月以降<br>採用者向け</h2>
          <p class="card-desc">
            2026年8月以降にご採用された新しい外注スタッフ向けのマニュアルです。（最新版）
          </p>
        </div>
        <div class="btn btn-v2">
          <span>新版マニュアルを開く</span>
          <span>→</span>
        </div>
      </a>
    </div>

    <footer>
      <p>&copy; 2026 Hatakeyama Research. All rights reserved.</p>
    </footer>
  </div>

</body>
</html>
